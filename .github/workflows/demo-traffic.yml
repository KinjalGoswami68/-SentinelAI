# Manual-only demo traffic: 5 fixture answers from the fictional "Volt Electronics
# support bot" to /ingest. The regular feed now runs inside the service
# (demo_feed.py: one answer every 10 min, 09:00-21:00 IST), because GitHub's
# scheduler delivered only a few of the scheduled runs. Use this to add a burst
# by hand. A manual run outside 09:00-21:00 IST wakes Render.
# Needs repo secret VOLT_API_KEY (Settings > Secrets and variables > Actions >
# Repository secrets).

name: demo-traffic

on:
  workflow_dispatch:

concurrency:
  group: demo-traffic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Inside 09:00-21:00 IST?
        id: check
        run: |
          ist=$(( ( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) + 330 ) % 1440 ))
          hhmm=$(printf '%02d:%02d' $((ist / 60)) $((ist % 60)))
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || { [ "$ist" -ge 540 ] && [ "$ist" -le 1260 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "$hhmm IST: running"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: GitHub delivered this scheduled run at $hhmm IST, outside 09:00-21:00."
          fi

  post:
    needs: window
    if: needs.window.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install (pinned from requirements.txt)
        run: pip install "$(grep '^requests==' requirements.txt)" "$(grep '^python-dotenv==' requirements.txt)"

      - name: POST 5 Volt Electronics answers
        env:
          VOLT_API_KEY: ${{ secrets.VOLT_API_KEY }}
          BASE_URL: https://sentinelai-qqph.onrender.com
        run: python -u scripts/demo_traffic.py
