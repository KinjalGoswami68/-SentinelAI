# Keeps the Render free instance awake 09:00-21:00 IST (03:30-15:30 UTC) with a
# /health request every 10 min, under Render's 15-min idle spin-down.
# Budget: ~12.25 h/day x 31 = ~380 of the workspace's 750 free hours/month.
# Outside the window the service sleeps. Each run waits up to 3 min for an
# answer, so a failed wake-up turns the run red and GitHub emails the owner.
# GitHub can deliver scheduled runs hours late (seen 2026-11-09: runs at
# 01:18 and 04:11 IST), so a scheduled run first checks the IST clock and
# skips outside 09:00-21:00. Minutes avoid :00, GitHub's busiest time.

name: keepalive-render

on:
  schedule:
    - cron: "37-59/10 3 * * *"   # 09:07, 09:17, 09:27 IST
    - cron: "7-59/10 4-14 * * *" # 09:37, 09:47 ... 20:27 IST
    - cron: "7-27/10 15 * * *"   # 20:37, 20:47, 20:57 IST
  workflow_dispatch:             # manual runs ignore the window: wake before a demo

concurrency:
  group: keepalive-render
  cancel-in-progress: false

permissions: {}

env:
  BASE_URL: https://sentinelai-qqph.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inside 09:00-21:00 IST?
        id: window
        run: |
          ist=$(( ( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) + 330 ) % 1440 ))
          hhmm=$(printf '%02d:%02d' $((ist / 60)) $((ist % 60)))
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || { [ "$ist" -ge 540 ] && [ "$ist" -le 1260 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "$hhmm IST: running"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: GitHub delivered this scheduled run at $hhmm IST, outside 09:00-21:00."
          fi

      - name: GET /health (wait up to 3 min)
        if: steps.window.outputs.run == 'true'
        run: |
          deadline=$(( $(date +%s) + 180 ))
          while :; do
            code=$(curl -s -m 20 -o health.json -w '%{http_code}' "$BASE_URL/health" || true)
            if [ "$code" = "200" ]; then
              db=$(jq -r '.database' health.json)
              echo "[$(date -u +%H:%M:%SZ)] http=200 database=$db started_at=$(jq -r '.started_at' health.json)"
              [ "$db" = "ok" ] || echo "::warning::service up but database=$db"
              exit 0
            fi
            echo "[$(date -u +%H:%M:%SZ)] http=$code, waiting"
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Render did not answer /health within 3 minutes."
              exit 1
            fi
            sleep 10
          done
