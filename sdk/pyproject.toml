[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Working name. The final PyPI name is chosen in M12; nothing is published before that.
name = "sentinelai"
version = "0.1.0"
description = "Send chatbot prompts and responses to SentinelAI, which catches regressions and explains them."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Kinjal Goswami" }]
dependencies = []

[project.urls]
Source = "https://github.com/KinjalGoswami68/-SentinelAI"

[tool.setuptools]
packages = ["sentinelai"]
