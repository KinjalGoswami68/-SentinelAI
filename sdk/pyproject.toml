[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Final name (M12): shiftlens. Not on PyPI yet; publish with: python -m build && twine upload dist/*
name = "shiftlens"
version = "0.1.0"
description = "Send chatbot prompts and responses to ShiftLens, which catches regressions and explains them."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Kinjal Goswami" }]
dependencies = []

[project.urls]
Source = "https://github.com/KinjalGoswami68/ShiftLens"

[tool.setuptools]
packages = ["shiftlens"]
